name: Deploy to GitHub Pages

# Builds the Vite app and deploys it to GitHub Pages via the Actions pipeline.
# Set Pages source to "GitHub Actions" in repository Settings → Pages.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# in-progress run and the latest queued run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
